name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk automake autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -n -i -E "error|failed|fatal|not found|undefined" build.log | grep -v -E "^[0-9]+:#|GITHUB|ENVIRONMENT" | tail -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: LocalStudio-apk
          path: bin/*.apk
